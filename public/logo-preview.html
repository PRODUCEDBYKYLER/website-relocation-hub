<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logo Preview</title>
  <style>
    @font-face {
      font-family: 'Tanker';
      src: url('/fonts/Tanker-Regular.woff2') format('woff2');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Bespoke Serif';
      src: url('/fonts/BespokeSerif-Regular.woff2') format('woff2');
      font-weight: 400;
      font-display: swap;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 80px;
      padding: 80px;
      font-family: sans-serif;
    }

    /* ── DARK VERSION ── */
    .logo-dark {
      background: hsl(30, 12%, 7%);
      padding: 48px 64px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      min-width: 420px;
    }

    .logo-dark .label {
      font-family: 'Bespoke Serif', serif;
      font-size: 13px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: hsl(75, 38%, 42%);
    }

    .logo-dark .name {
      font-family: 'Tanker', sans-serif;
      font-weight: 400;
      font-size: 52px;
      color: hsl(38, 33%, 78%);
      letter-spacing: 0.02em;
      text-transform: uppercase;
      line-height: 1;
    }

    .logo-dark .divider {
      width: 48px;
      height: 2px;
      background: hsl(75, 38%, 42%);
      margin: 6px 0;
    }

    .logo-dark .location {
      font-family: 'Bespoke Serif', serif;
      font-size: 11px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: hsl(38, 20%, 52%);
    }

    /* ── LIGHT VERSION ── */
    .logo-light {
      background: hsl(38, 33%, 90%);
      padding: 48px 64px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      min-width: 420px;
    }

    .logo-light .label {
      font-family: 'Bespoke Serif', serif;
      font-size: 13px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: hsl(75, 38%, 32%);
    }

    .logo-light .name {
      font-family: 'Tanker', sans-serif;
      font-weight: 400;
      font-size: 52px;
      color: hsl(30, 12%, 10%);
      letter-spacing: 0.02em;
      text-transform: uppercase;
      line-height: 1;
    }

    .logo-light .divider {
      width: 48px;
      height: 2px;
      background: hsl(75, 38%, 32%);
      margin: 6px 0;
    }

    .logo-light .location {
      font-family: 'Bespoke Serif', serif;
      font-size: 11px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: hsl(30, 12%, 35%);
    }

    /* ── STACKED COMPACT VERSION ── */
    .logo-compact {
      background: hsl(30, 12%, 7%);
      padding: 36px 48px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      min-width: 320px;
    }

    .logo-compact .produced {
      font-family: 'Bespoke Serif', serif;
      font-size: 13px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: hsl(75, 38%, 42%);
    }

    .logo-compact .by-kyler {
      font-family: 'Tanker', sans-serif;
      font-weight: 400;
      font-size: 48px;
      color: hsl(38, 33%, 78%);
      letter-spacing: 0.02em;
      text-transform: uppercase;
      line-height: 0.95;
    }

    .logo-compact .rule {
      width: 100%;
      height: 1.5px;
      background: hsl(75, 38%, 42%);
      margin: 8px 0 6px;
    }

    .logo-compact .sub {
      font-family: 'Bespoke Serif', serif;
      font-size: 10px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: hsl(38, 20%, 52%);
    }
  </style>
</head>
<body>

  <!-- Version 1: Centered, full name -->
  <div class="logo-dark">
    <span class="label">Produced by</span>
    <span class="name">Kyler Chavez</span>
    <div class="divider"></div>
    <span class="location">Round Rock, TX</span>
  </div>

  <!-- Version 2: Light background -->
  <div class="logo-light">
    <span class="label">Produced by</span>
    <span class="name">Kyler Chavez</span>
    <div class="divider"></div>
    <span class="location">Round Rock, TX</span>
  </div>

  <!-- Version 3: Left-aligned stacked -->
  <div class="logo-compact">
    <span class="produced">Produced by</span>
    <span class="by-kyler">Kyler<br/>Chavez</span>
    <div class="rule"></div>
    <span class="sub">Round Rock, TX</span>
  </div>

</body>
</html>
